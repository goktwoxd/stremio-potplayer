name: Bug report
description: Something isn't working
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include copyrighted posters,
        torrent/debrid screenshots, personal information, stream URLs, or API
        tokens.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "155.0.8059.82"
    validations:
      required: true
  - type: input
    id: potplayer
    attributes:
      label: PotPlayer version
      placeholder: "v260819"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Stremio UI language
      placeholder: "English, Türkçe, Deutsch..."
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
      placeholder: "1.0.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output, `chrome://extensions` errors, or installer output. Redact stream URLs and API tokens.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using content I am allowed to access.
          required: true
        - label: I did not include personal information or piracy screenshots.
          required: true
