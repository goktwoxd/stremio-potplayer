name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate manifest
        shell: pwsh
        run: |
          $manifest = Get-Content extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "manifest_version must be 3" }
          if (-not $manifest.content_scripts) { throw "content_scripts is missing" }
          if ($manifest.content_scripts[0].world -ne "MAIN") { throw "content script must run in the MAIN world" }
          if ($manifest.permissions) { throw "the extension should not request API permissions" }

      - name: Check JavaScript syntax
        run: |
          node --check extension/labels.js
          node --check extension/content.js

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build release zip
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: stremio-potplayer
          path: dist/*.zip
          if-no-files-found: error
