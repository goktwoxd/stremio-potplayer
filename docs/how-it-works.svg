<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How Stremio Web to PotPlayer works</title>
  <desc id="desc">Click Copy stream link in Stremio Web, allow the Chrome prompt once, and the stream opens in a new PotPlayer window.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0d18"/>
      <stop offset="1" stop-color="#171226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#5b3bd6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- Card 1: Stremio Web -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="320" height="280" rx="18" fill="#1a1530" stroke="#2e2752"/>
    <circle cx="72" cy="108" r="9" fill="url(#accent)"/>
    <text x="90" y="113" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Stremio Web</text>

    <rect x="60" y="136" width="280" height="184" rx="10" fill="#120f20" stroke="#2b2548"/>
    <text x="80" y="168" fill="#8f87ad" font-family="Segoe UI, Arial, sans-serif" font-size="13">Play</text>

    <rect x="72" y="184" width="256" height="42" rx="8" fill="#3a2a7a"/>
    <rect x="88" y="197" width="13" height="15" rx="2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    <rect x="91" y="200" width="7" height="9" rx="1" fill="#ffffff"/>
    <text x="112" y="210" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Copy stream link</text>

    <text x="80" y="254" fill="#8f87ad" font-family="Segoe UI, Arial, sans-serif" font-size="13">Stream details</text>
    <text x="80" y="300" fill="#5f587a" font-family="Segoe UI, Arial, sans-serif" font-size="11">Right-click or use the ··· menu</text>

    <path d="M300 198 l0 30 l8 -8 l6 13 l7 -3 l-6 -13 l11 0 z" fill="#ffffff" stroke="#120f20" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="40" y="382" fill="#a79fc9" font-family="Segoe UI, Arial, sans-serif" font-size="13">1 · Click <tspan fill="#ffffff" font-weight="600">Copy stream link</tspan></text>

  <!-- Arrow 1 -->
  <g stroke="#6f5bd0" stroke-width="2" fill="none">
    <path d="M366 210 H428"/>
    <path d="M420 204 l8 6 l-8 6" fill="#6f5bd0" stroke="none"/>
  </g>
  <text x="368" y="196" fill="#8f87ad" font-family="Segoe UI, Arial, sans-serif" font-size="11">clipboard</text>

  <!-- Card 2: Chrome prompt -->
  <g filter="url(#shadow)">
    <rect x="440" y="70" width="320" height="280" rx="18" fill="#1a1530" stroke="#2e2752"/>
    <rect x="440" y="70" width="320" height="38" rx="18" fill="#241d3d"/>
    <rect x="440" y="90" width="320" height="18" fill="#241d3d"/>
    <circle cx="462" cy="89" r="4" fill="#6f678f"/>
    <circle cx="476" cy="89" r="4" fill="#6f678f"/>
    <circle cx="490" cy="89" r="4" fill="#6f678f"/>
    <rect x="506" y="79" width="230" height="20" rx="3" fill="#15111f"/>
    <text x="516" y="94" fill="#a79fc9" font-family="Segoe UI, Arial, sans-serif" font-size="10">web.stremio.com</text>

    <rect x="460" y="128" width="280" height="170" rx="10" fill="#f7f5ff"/>
    <text x="478" y="160" fill="#1c1730" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Open PotPlayer?</text>
    <text x="478" y="182" fill="#5b5570" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">web.stremio.com wants to open this application.</text>

    <rect x="478" y="204" width="14" height="14" rx="3" fill="#ffffff" stroke="#8b84a3"/>
    <path d="M481 211 l3 3 l6 -7" fill="none" stroke="#5b3bd6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="216" fill="#3b3550" font-family="Segoe UI, Arial, sans-serif" font-size="11">Always allow links like this</text>

    <text x="596" y="264" fill="#5b5570" font-family="Segoe UI, Arial, sans-serif" font-size="12">Cancel</text>
    <rect x="654" y="246" width="66" height="30" rx="6" fill="url(#accent)"/>
    <text x="687" y="266" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open</text>
  </g>
  <text x="440" y="382" fill="#a79fc9" font-family="Segoe UI, Arial, sans-serif" font-size="13">2 · Allow once in Chrome</text>

  <!-- Arrow 2 -->
  <g stroke="#6f5bd0" stroke-width="2" fill="none">
    <path d="M766 210 H828"/>
    <path d="M820 204 l8 6 l-8 6" fill="#6f5bd0" stroke="none"/>
  </g>
  <text x="766" y="190" fill="#8f87ad" font-family="Segoe UI, Arial, sans-serif" font-size="10">stremio-</text>
  <text x="766" y="204" fill="#8f87ad" font-family="Segoe UI, Arial, sans-serif" font-size="10">potplayer:</text>

  <!-- Card 3: PotPlayer -->
  <g filter="url(#shadow)">
    <rect x="840" y="70" width="320" height="280" rx="18" fill="#1a1530" stroke="#2e2752"/>
    <rect x="840" y="70" width="320" height="38" rx="18" fill="#241d3d"/>
    <rect x="840" y="90" width="320" height="18" fill="#241d3d"/>
    <text x="860" y="94" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">PotPlayer</text>
    <circle cx="1122" cy="89" r="4" fill="#6f678f"/>
    <circle cx="1136" cy="89" r="4" fill="#6f678f"/>

    <rect x="860" y="128" width="280" height="150" rx="8" fill="#0a0813"/>
    <circle cx="1000" cy="203" r="28" fill="url(#accent)"/>
    <path d="M992 189 l24 14 l-24 14 z" fill="#ffffff"/>

    <text x="860" y="306" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Now playing</text>
    <text x="860" y="324" fill="#8f87ad" font-family="Segoe UI, Arial, sans-serif" font-size="10">New window · /clipboard /new</text>
    <rect x="860" y="334" width="280" height="5" rx="2.5" fill="#2b2548"/>
    <rect x="860" y="334" width="176" height="5" rx="2.5" fill="#7b61ff"/>
  </g>
  <text x="840" y="382" fill="#a79fc9" font-family="Segoe UI, Arial, sans-serif" font-size="13">3 · Plays in a new window</text>

  <text x="600" y="410" fill="#5f587a" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">Illustration only — no third-party artwork or content is shown.</text>
</svg>
